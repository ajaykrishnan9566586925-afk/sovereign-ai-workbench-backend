server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

spring:
  application:
    name: sovereign-ai-workbench-backend

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 12MB
      file-size-threshold: 2KB

  security:
    oauth2:
      resourceserver:
        jwt:
          secret-key: ${JWT_SECRET:change-this-development-secret-key-32chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  agent:
    base-url: ${AGENT_BASE_URL:http://localhost:9000}
    connect-timeout-ms: 3000
    read-timeout-ms: 30000

  storage:
    upload-directory: ${UPLOAD_DIRECTORY:storage/uploads}

  security:
    allowed-extensions:
      - pdf
      - txt
      - csv
      - docx
      - xlsx
    max-file-size-bytes: 10485760